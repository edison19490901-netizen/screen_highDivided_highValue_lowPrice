name: Daily Dashboard Update

on:
  schedule:
    # 北京时间 15:30 = UTC 07:30, 周一至周五
    - cron: '30 7 * * 1-5'
  workflow_dispatch:  # 手动触发（GitHub 网页点按钮）

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install tushare baostock pandas pyarrow python-dotenv

      - name: Run update pipeline
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python gh_update.py

      - name: Push to GitHub Pages
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # Clone Pages repo, copy dashboard.html as index.html, push
          git clone --depth=1 \
            "https://x-access-token:${GH_PAT}@github.com/edison19490901-netizen/dashboard-of-high_divided_screen.git" \
            /tmp/pages

          cp dashboard.html /tmp/pages/index.html

          cd /tmp/pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html

          if git diff --cached --quiet; then
            echo "No changes, skip push"
          else
            git commit -m "auto: dashboard update $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
            echo "Pushed to GitHub Pages"
          fi
